<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تسجيل الطلاب</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen">
  <nav class="bg-white shadow">
    <div class="max-w-2xl mx-auto px-4 py-3 flex gap-4 text-sm font-semibold">
      <a href="/" class="text-indigo-600">التسجيل</a>
      <a href="/find.html" class="text-slate-600 hover:text-indigo-600">بحث عن مجموعتك</a>
    </div>
  </nav>

  <main class="max-w-2xl mx-auto p-4">
    <div class="bg-white rounded-2xl shadow p-6 mt-6">
      <h1 class="text-2xl font-bold mb-1">تسجيل بيانات الطالب</h1>
      <p class="text-slate-500 text-sm mb-6">كل الحقول إجبارية، ولا يتم التسجيل إلا بعد استكمالها.</p>

      <form id="form" class="space-y-4" novalidate>
        <div>
          <label class="block text-sm font-semibold mb-1">الاسم الكامل *</label>
          <input name="fullName" required minlength="3" autocomplete="off" class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-400">
        </div>
        <div>
          <label class="block text-sm font-semibold mb-1">كود الكلية * <span class="text-slate-400 font-normal">(فريد - لا يقبل التكرار)</span></label>
          <input name="collegeCode" required dir="ltr" autocomplete="off" class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-400">
        </div>
        <div>
          <label class="block text-sm font-semibold mb-1">الجنس *</label>
          <div class="flex gap-6">
            <label class="flex items-center gap-2"><input type="radio" name="gender" value="male" required> شاب</label>
            <label class="flex items-center gap-2"><input type="radio" name="gender" value="female"> بنت</label>
          </div>
        </div>
        <div>
          <label class="block text-sm font-semibold mb-1">رقم الهاتف / الواتساب *</label>
          <input name="phone" required dir="ltr" inputmode="tel" placeholder="01012345678" autocomplete="off" class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-400">
        </div>
        <div>
          <label class="block text-sm font-semibold mb-1">المجموعة الأصلية *</label>
          <input name="originalGroup" required autocomplete="off" class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-400">
        </div>

        <p id="hint" class="text-sm text-amber-700 bg-amber-50 rounded-lg px-3 py-2"></p>
        <div id="msg" class="hidden rounded-lg px-3 py-2 text-sm"></div>

        <button id="btn" disabled class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-lg transition disabled:opacity-50 disabled:cursor-not-allowed">تسجيل</button>
      </form>
    </div>
  </main>

  <script>
    const form = document.getElementById('form');
    const msg = document.getElementById('msg');
    const btn = document.getElementById('btn');
    const hint = document.getElementById('hint');

    function show(text, ok) {
      msg.textContent = text;
      msg.className = 'rounded-lg px-3 py-2 text-sm ' + (ok ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800');
    }

    // يرجع قائمة الحقول الناقصة/غير الصحيحة
    function missingFields() {
      const d = Object.fromEntries(new FormData(form).entries());
      const miss = [];
      if (!d.fullName || d.fullName.trim().length < 3) miss.push('الاسم الكامل');
      if (!/^[A-Za-z0-9\-_]{1,20}$/.test((d.collegeCode || '').trim())) miss.push('كود الكلية');
      if (!d.gender) miss.push('الجنس');
      if (!/^\+?[0-9]{8,15}$/.test((d.phone || '').replace(/[\s\-]/g, ''))) miss.push('رقم الهاتف');
      if (!(d.originalGroup || '').trim()) miss.push('المجموعة الأصلية');
      return miss;
    }

    function refresh() {
      const miss = missingFields();
      btn.disabled = miss.length > 0;
      hint.textContent = miss.length ? 'أكمل: ' + miss.join('، ') : '';
      hint.classList.toggle('hidden', miss.length === 0);
    }
    form.addEventListener('input', refresh);
    form.addEventListener('change', refresh);
    refresh();

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (missingFields().length) return refresh();
      const body = Object.fromEntries(new FormData(form).entries());
      btn.disabled = true;
      try {
        const res = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        const data = await res.json();
        if (res.ok) {
          show(data.message + ' اكتب كودك في صفحة "بحث عن مجموعتك" لتشوف أعضاء مجموعتك.', true);
          form.reset();
        } else {
          show(data.error || 'حدث خطأ.', false);
        }
      } catch {
        show('تعذّر الاتصال بالخادم.', false);
      } finally {
        refresh();
      }
    });
  </script>
</body>
</html>
